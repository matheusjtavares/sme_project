[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

# Directories Ruff should ignore entirely
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "static",
    "media",
]

[tool.ruff.lint]
# Core Python quality + PEP 8
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
    "DJ",     # Ruff-specific rules        
]

# Rules that are too noisy / opinionated for most Django projects
ignore = [
    "E501",     # Line too long - formatter handles line wrapping
    "PLR0913",  # Too many function arguments
    "PLR2004",  # Magic value used in comparison
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
]

[tool.ruff.lint.per-file-ignores]
# Django settings often require imports that look unused or wildcard imports
"**/settings/*.py" = [
    "F403",
    "F405",
]

# Django migrations are generated code
"**/migrations/*.py" = [
    "ALL",
]

# Tests can reasonably use assertions, magic values, etc.
"**/tests/**/*.py" = [
    "S101",
    "PLR2004",
]

[tool.ruff.lint.isort]
# Django imports should be grouped naturally with third-party imports
known-first-party = [
    "your_project",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true