####################################################################
# Render Blueprint for the Sales & Commission Management System
#
# Deploy: push this file to your repo root, then in the Render
# dashboard choose "New > Blueprint" and select this repository.
# Render will create/update all resources below to match this file
# on every push to the connected branch (Blueprint sync).
#
# NOTE: the free PostgreSQL instance expires 30 days after creation.
# Recreate the stack via New > Blueprint when that happens.
####################################################################

databases:
  - name: sme-db
    plan: free              # 1 GB storage, expires 30 days after creation
    databaseName: sme_db
    user: sme_user

services:
  # ---------------------------------------------------------------
  # Django REST API
  # ---------------------------------------------------------------
  - type: web
    name: sme-backend
    runtime: python         # uv is bundled in Render's Python runtime
    plan: free
    branch: main
    rootDir: backend
    buildCommand: >-
      uv sync --frozen --no-dev &&
      uv run python manage.py migrate &&
      uv run python manage.py seed_superuser &&
      uv run python manage.py collectstatic --noinput
    startCommand: uv run gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    # Only rebuild this service when backend/ (or this file) changes
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a random secret
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: https://sme-backend-u65g.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sme-db
          property: connectionString  # internal URL (free + fast, same region)
      - key: CORS_ALLOWED_ORIGINS
        value: https://sme-frontend-7e6j.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sme-frontend-7e6j.onrender.com

  # ---------------------------------------------------------------
  # React SPA (served from the CDN)
  # ---------------------------------------------------------------
  - type: web
    name: sme-frontend
    runtime: static          # static sites have no `plan` field — always free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    # React Router client-side routing: serve index.html for any path that
    # doesn't match a real file so deep links / refreshes don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable # hashed bundle files
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://sme-backend-u65g.onrender.com/api